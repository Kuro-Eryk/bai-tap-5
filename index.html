<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="bai-tap-5.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Bai-5</title>
    <style></style>
  </head>
  <body>
    <section class="body-background">
      <aside class="sidebar">
        <div class="side-menu">
          <div class="logo">
            <button class="menu-btn">
              <img src="icon1.png" alt="" />
            </button>
          </div>

          <div class="logo1">
            <button class="menu-btn">
              <img src="icon2.png" alt="" />
            </button>
          </div>

          <div class="logo1">
            <button class="menu-btn">
              <img src="icon3.png" alt="" />
            </button>
          </div>

          <div class="logo1">
            <button class="menu-btn">
              <img src="icon4.png" alt="" />
            </button>
          </div>

          <div class="logo1">
            <button class="menu-btn">
              <img src="icon5.png" alt="" />
            </button>
          </div>
        </div>
      </aside>

      <div class="main-wrapper">
        <header class="header">
          <div class="welcome-section">
            <h2>Welcome, Amanda</h2>
            <span class="date-text">Tue, 07 June 2022</span>
          </div>
          <div class="user-section">
            <div class="search-box">
              <svg
                class="search-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#888"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" placeholder="Search" />
            </div>
            <div class="ring">
              <img
                src="Group 77.png
              "
                alt="chuong"
              />
            </div>
            <div class="avatar-box">
              <img src="avt0.png" alt="User Avatar" />
            </div>
          </div>
        </header>
        <main class="main-content">
          <img
            src="anhmau.jpg"
            alt="anhmau"
            width="100%"
            height="100px"
            style="margin-bottom: 16px"
          />
          <section class="extra-content">
            <div class="profile-bar">
              <div class="user-info">
                <div class="avatar-container">
                  <img src="avt.png" alt="Avatar" />
                </div>

                <div class="text-details">
                  <span class="user-name">Alexa Rawles</span>
                  <span class="user-email">alexarawles@gmail.com</span>
                </div>
              </div>

              <button class="btn-edit">Edit</button>
            </div>
          </section>
          <section class="extra-content">
            <div class="form-container">
              <div class="form-group">
                <label for="fullName">Full Name</label>
                <div class="input-wrapper">
                  <input
                    type="text"
                    id="fullName"
                    placeholder="Your First Name"
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="nickname">Nick name</label>
                <div class="input-wrapper">
                  <input
                    type="text"
                    id="nickname"
                    placeholder="Your Nick Name"
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="gender">Gender</label>
                <div class="input-wrapper select-wrapper">
                  <select id="gender">
                    <option value="" disabled selected hidden>
                      Your Gender
                    </option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label for="country">Country</label>
                <div class="input-wrapper select-wrapper">
                  <select id="country">
                    <option value="" disabled selected hidden>
                      Your Country
                    </option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label for="language">Language</label>
                <div class="input-wrapper select-wrapper">
                  <select id="language">
                    <option value="" disabled selected hidden>
                      Your Language
                    </option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label for="timezone">Time Zone</label>
                <div class="input-wrapper select-wrapper">
                  <select id="timezone">
                    <option value="" disabled selected hidden>
                      Your Time Zone
                    </option>
                  </select>
                </div>
              </div>
            </div>
          </section>
          <section class="extra-content">
            <div class="email-box">
              <div class="title">My email Address</div>

              <div class="email-info">
                <div class="mail-icon">
                  <img src="sms.png" alt="Mail Icon" />
                </div>

                <div class="email-content">
                  <div>alexarawles@gmail.com</div>
                  <div class="time">1 month ago</div>
                </div>
              </div>
              <button class="add-email">+ Add Email Address</button>
            </div>
          </section>
        </main>
      </div>
    </section>
  </body>
</html>
